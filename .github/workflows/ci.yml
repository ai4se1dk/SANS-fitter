name: CI

on:
  push:
    branches: [ "**" ]
    tags: ['v*']
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        cache: true

    - name: Check code formatting
      run: pixi run format-check

    - name: Lint code
      run: pixi run lint-check

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The interpreter is pinned in pixi.lock, so varying python-version
        # here would just repeat the same run. Vary the platform instead —
        # pixi.lock covers linux-64, win-64, osx-64 and osx-arm64.
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v6

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        cache: true

    - name: Run Tests
      run: pixi run test

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        cache: true

    - name: Run Coverage
      run: pixi run test-coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        slug: ai4se1dk/SANS-fitter

    # Was a separate workflow that re-ran the whole suite to produce the same
    # coverage.xml. Uploading is best-effort: secrets are not available to
    # pull requests from forks, and a reporting outage should not fail CI.
    - name: Upload coverage to Codacy
      uses: codacy/codacy-coverage-reporter-action@v1.3.0
      continue-on-error: true
      with:
        api-token: ${{ secrets.CODACY_API_TOKEN }}
        coverage-reports: ./coverage.xml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write  # Required for trusted publishing

    environment:
      name: pypi
      url: https://pypi.org/project/sans-fitter/

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install build dependencies
      run: python -m pip install --upgrade pip build

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
